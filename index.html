<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- displays site properly based on user's device -->

		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./assets/images/favicon-32x32.png"
		/>

		<title>Frontend Mentor | Social links profile</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<article class="social-links">
			<figure class="social-links__avatar-container">
				<img
					src="./assets/images/avatar-jessica.jpeg"
					alt="picture of woman"
					srcset=""
					class="social-links__avatar"
				/>
			</figure>
			<header class="social-links__header">
				<div class="social-links__name">Jessica Randall</div>
				<div class="social-links__location">London, United Kingdom</div>
			</header>
			<div class="social-links__description">
				"Front-end developer and avid reader."
			</div>
			<ul class="social-links__wrapper">
				<li class="social-links__link-container">
					<a
						href="#"
						target="_blank"
						rel="noopener noreferrer"
						class="social-links__link"
						>GitHub</a
					>
				</li>
				<li class="social-links__link-container">
					<a
						href="#"
						target="_blank"
						rel="noopener noreferrer"
						class="social-links__link"
						>Frontend</a
					>
				</li>
				<li class="social-links__link-container">
					<a
						href="#"
						target="_blank"
						rel="noopener noreferrer"
						class="social-links__link"
						>Mentor</a
					>
				</li>
				<li class="social-links__link-container">
					<a
						href="#"
						target="_blank"
						rel="noopener noreferrer"
						class="social-links__link"
						>LinkedIn</a
					>
				</li>
				<li class="social-links__link-container">
					<a
						href="#"
						target="_blank"
						rel="noopener noreferrer"
						class="social-links__link"
						>Twitter</a
					>
				</li>
				<li class="social-links__link-container">
					<a
						href="#"
						target="_blank"
						rel="noopener noreferrer"
						class="social-links__link"
						>Instagram</a
					>
				</li>
			</ul>
		</article>
	</body>
</html>
